<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/output.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
        <link rel="icon" href="data:,">
        <title>[HelpDesk]</title>
    </head>
    <body class="bg-gray-300 m-0 p-0">
        <header class="bg-white p-6 flex justify-between items-center">
            <div class="flex justify-around gap-2">
                <p class="bg-[#202A38] w-8 h-8 rounded-xl text-white flex justify-center items-center font-bold text-2xl">H</p>
                <p class="text-2xl">HelpDesk</p>
            </div>
            <nav class="hidden md:flex lg:flex">
                <a href="index.html">Atlas Solutions / Support</a>
            </nav>
            <button class="md:hidden lg:hidden text-3xl">&#9776;</button>
        </header>

        <main class="m-6">
            <h1 class="text-2xl mb-4">Gestion des demandes</h1>
            <p class="text-[#8792A1] mb-6">
                Suivez et gérez les incidents informatiques.
            </p>

            <section class="bg-white p-3 rounded-xl pt-6">

                <h2 class="font-bold text-2xl text-[#202A38]">Créer une demande</h2>
                <p class="text-[#8792A1] mb-4">Décrivez votre problème informatique.</p>

                <form id="formulaire" novalidate class="grid grid-cols-1 gap-3.5  md:grid-cols-2">

                    <label for="probleme-titre">
                        <p class="text-xl">Titre du problème *</p>
                    </label>
                    <input type="text" name="probleme-titre" id="probleme-titre" placeholder="Connexion Wi-Fi instable" required class="border-2 border-[#8792A1] border-solid rounded-xl h-10 p-4">

                    <label for="categorie-choix" class="grid grid-cols-1 gap-2">
                        <p class="text-xl">Catégorie *</p>
                    </label>
                    <select id="categorie-choix" name="categorie-choix" class="border-2 border-[#8792A1] border-solid rounded-xl h-10 pl-4">
                        <option id="categorie-value" value="" disabled selected>Choisissez un seul choix.</option>
                        <option value="Réseau">Réseau</option>
                        <option value="Matériel">Matériel</option>
                        <option value="Logiciel">Logiciel</option>
                    </select>
                    
                    <label for="propriete-choix" class="grid grid-cols-1 gap-2">
                        <p class="text-xl">Priorité *</p>
                    </label>
                    <select name="propriete-choix" id="propriete-choix" class="border-2 border-[#8792A1] border-solid rounded-xl h-10 pl-4">
                        <option id="categorie-value" value="" disabled selected>Choisissez un seul choix.</option>
                        <option value="Haute">Haute</option>
                        <option value="Normale">Normale</option>
                        <option value="Basse">Basse</option>
                    </select>
                    
                    
                    <label for="probleme-description" class="grid grid-cols-1 gap-2">
                        <p class="text-xl">Description *</p>
                    </label>
                    <input id="probleme-description" name="probleme-description" placeholder="Décrivez votre problème... " required class="border-2 border-[#8792A1] border-solid rounded-xl h-14 pl-4 ">
                    
                    
                    <button class="bg-[#252F3E] text-white font-bold border-solid rounded-xl h-10 px-4" id="ajout-btn">＋  Ajouter la demande</button>
                    <p id="form-message"></p>
                    
                </form>
            </section>

            <section>

                <div class="flex justify-between items-center pt-8">
                    <h2 class="text-2xl text-[#202A38]">Liste des demandes</h2>
                    <p id="nombre-demande" class="bg-[#EBEFF4] rounded-2xl p-1">
                        3 demandes
                    </p>
                </div>

                <div id="cards" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 mt-4">
                    
                </div>
            </section>
        </main>

    
        <script src="js/script.js"></script>
    </body>
</html>
